[devops_node]
13.201.78.74

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/devops-key
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
EO

cat << 'EOF' > ansible/setup.yml
---
- name: Configure AWS DevOps Node with Docker, Jenkins, and Kubernetes (k3s)
  hosts: devops_node
  become: yes

  tasks:
    - name: Create 2GB swap file for memory stability
      shell: |
        if [ ! -f /swapfile ]; then
          fallocate -l 2G /swapfile
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile
        fi

    - name: Update apt cache and install Docker, Java 17, and curl
      apt:
        update_cache: yes
        name:
          - docker.io
          - openjdk-17-jre
          - fontconfig
          - curl
        state: present

    - name: Start and enable Docker service
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Download Jenkins GPG key
      get_url:
        url: https://jenkins.io
        dest: /usr/share/keyrings/jenkins-keyring.asc
        mode: '0644'

    - name: Add Jenkins apt repository
      apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/jenkins-keyring.asc] https://jenkins.io binary/"
        state: present

    - name: Install Jenkins
      apt:
        update_cache: yes
        name: jenkins
        state: present

    - name: Add ubuntu and jenkins users to docker group
      user:
        name: "{{ item }}"
        groups: docker
        append: yes
      loop:
        - ubuntu
        - jenkins

    - name: Restart Jenkins to apply docker group permissions
      systemd:
        name: jenkins
        state: restarted
        enabled: yes

    - name: Install Kubernetes (k3s) with Docker runtime support
      shell: curl -sfL https://k3s.io | sh -s - --docker --write-kubeconfig-mode 644
      args:
        creates: /usr/local/bin/k3s

    - name: Print Jenkins Initial Admin Password
      command: cat /var/lib/jenkins/secrets/initialAdminPassword
      register: jenkins_pass

    - name: Display Jenkins Password
      debug:
        msg: "Jenkins Initial Admin Password: {{ jenkins_pass.stdout }}"
