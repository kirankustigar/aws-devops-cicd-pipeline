apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-web-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8s-web-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: k8s-web-app
    spec:
      containers:
        - name: web-container
          image: k8s-web-app:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-web-service
spec:
  type: NodePort
  selector:
    app: k8s-web-app
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
